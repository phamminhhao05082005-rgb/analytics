<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Display Settings Card</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="card15.css">
</head>
<body class="bg-light p-5 d-flex justify-content-center">

<div class="display-settings-card shadow-sm bg-white">
    
    <div class="card-header-section">
        <h2 class="card-main-title">Hiển thị dữ liệu</h2>
        <p class="card-sub-desc">Các chế độ cài đặt này kiểm soát cách hiển thị dữ liệu trong báo cáo</p>
    </div>

    <div class="settings-list d-flex flex-column pb-3">
        
        <a href="#" class="setting-item d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div class="icon-wrapper">
                    <i class="bi bi-hand-index-thumb"></i>
                </div>
                <span class="setting-text">Sự kiện</span>
            </div>
            <div class="help-icon-wrapper" data-bs-toggle="tooltip" data-bs-placement="top" title="Trợ giúp về Sự kiện">
                <i class="bi bi-question-circle"></i>
            </div>
        </a>

        <a href="#" class="setting-item d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div class="icon-wrapper">
                    <i class="bi bi-diagram-3"></i>
                </div>
                <span class="setting-text">Cài đặt mạng</span>
            </div>
            <div class="help-icon-wrapper" data-bs-toggle="tooltip" data-bs-placement="top" title="Trợ giúp về Cài đặt mạng">
                <i class="bi bi-question-circle"></i>
            </div>
        </a>

        <a href="#" class="setting-item d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div class="icon-wrapper">
                    <i class="bi bi-person-vcard"></i>
                </div>
                <span class="setting-text">Đối tượng</span>
            </div>
            <div class="help-icon-wrapper" data-bs-toggle="tooltip" data-bs-placement="top" title="Trợ giúp về Đối tượng">
                <i class="bi bi-question-circle"></i>
            </div>
        </a>

        <a href="#" class="setting-item d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div class="icon-wrapper">
                    <i class="bi bi-sticky"></i>
                </div>
                <span class="setting-text">Chú thích</span>
            </div>
            <div class="help-icon-wrapper" data-bs-toggle="tooltip" data-bs-placement="top" title="Trợ giúp về Chú thích">
                <i class="bi bi-question-circle"></i>
            </div>
        </a>

        <a href="#" class="setting-item d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div class="icon-wrapper">
                    <i class="bi bi-layout-split"></i>
                </div>
                <span class="setting-text">Phép so sánh</span>
            </div>
            <div class="help-icon-wrapper" data-bs-toggle="tooltip" data-bs-placement="top" title="Trợ giúp về Phép so sánh">
                <i class="bi bi-question-circle"></i>
            </div>
        </a>

        <a href="#" class="setting-item d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div class="icon-wrapper">
                    <i class="bi bi-distribute-vertical"></i>
                </div>
                <span class="setting-text">Phân đoạn</span>
            </div>
            <div class="help-icon-wrapper" data-bs-toggle="tooltip" data-bs-placement="top" title="Trợ giúp về Phân đoạn">
                <i class="bi bi-question-circle"></i>
            </div>
        </a>

        <a href="#" class="setting-item d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div class="icon-wrapper">
                    <i class="bi bi-boxes"></i>
                </div>
                <span class="setting-text">Định nghĩa tuỳ chỉnh</span>
            </div>
            <div class="help-icon-wrapper" data-bs-toggle="tooltip" data-bs-placement="top" title="Trợ giúp về Định nghĩa tuỳ chỉnh">
                <i class="bi bi-question-circle"></i>
            </div>
        </a>

        <a href="#" class="setting-item d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div class="icon-wrapper">
                    <i class="bi bi-signpost-split"></i>
                </div>
                <span class="setting-text">Nhóm kênh</span>
            </div>
            <div class="help-icon-wrapper" data-bs-toggle="tooltip" data-bs-placement="top" title="Trợ giúp về Nhóm kênh">
                <i class="bi bi-question-circle"></i>
            </div>
        </a>

        <a href="#" class="setting-item d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div class="icon-wrapper">
                    <i class="bi bi-person-bounding-box"></i>
                </div>
                <span class="setting-text">Thông tin nhận dạng trong báo cáo</span>
            </div>
            <div class="help-icon-wrapper" data-bs-toggle="tooltip" data-bs-placement="top" title="Trợ giúp về Thông tin nhận dạng trong báo cáo">
                <i class="bi bi-question-circle"></i>
            </div>
        </a>

        <a href="#" class="setting-item d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div class="icon-wrapper">
                    <i class="bi bi-diagram-2"></i>
                </div>
                <span class="setting-text">DebugView</span>
            </div>
            <div class="help-icon-wrapper" data-bs-toggle="tooltip" data-bs-placement="top" title="Trợ giúp về DebugView">
                <i class="bi bi-question-circle"></i>
            </div>
        </a>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="card15.js"></script>
</body>
</html>
