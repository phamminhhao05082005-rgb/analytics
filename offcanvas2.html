<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Notes Offcanvas</title>    
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="offcanvas2.css">
</head>
<body class="bg-light p-5">

<button class="btn btn-outline-secondary d-flex align-items-center gap-2 bg-white" type="button" data-bs-toggle="offcanvas" data-bs-target="#notesOffcanvas">
    <i class="bi bi-card-text"></i> Xem chú thích
</button>

<div class="offcanvas offcanvas-end custom-notes-offcanvas shadow" tabindex="-1" id="notesOffcanvas">
    
    <!-- Màn hình 1: Danh sách chú thích -->
    <div id="viewScreen" class="screen-container active">
        <div class="offcanvas-header border-bottom">
            <div class="d-flex align-items-center gap-3">
                <i class="bi bi-card-text fs-5 text-secondary"></i>
                <span class="fs-5 text-dark" style="font-weight: 400;">Trình xem chú thích</span>
            </div>
            <button type="button" class="btn-close-custom" data-bs-dismiss="offcanvas">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
        
        <div class="offcanvas-body d-flex align-items-center justify-content-center text-center p-4">
            <p class="text-secondary" style="font-size: 14px; line-height: 1.5; max-width: 250px;">
                Không có chú thích nào trong phạm vi ngày hiện tại. Hãy nhấp vào nút bên dưới để tạo một chú thích.
            </p>
        </div>
        
        <div class="offcanvas-footer border-top p-3 d-flex justify-content-between align-items-center">
            <button class="btn btn-link text-secondary p-0 fs-5">
                <i class="bi bi-gear"></i>
            </button>
            <button class="btn btn-primary px-4 py-2 custom-btn-primary" id="btnGoToCreate">Tạo chú thích</button>
        </div>
    </div>

    <!-- Màn hình 2: Tạo chú thích -->
    <div id="createScreen" class="screen-container">
        <div class="offcanvas-header border-bottom">
            <div class="d-flex align-items-center gap-3">
                <button class="btn-back" id="btnGoBack">
                    <i class="bi bi-arrow-left"></i>
                </button>
                <span class="fs-5 text-dark" style="font-weight: 400;">Tạo chú thích</span>
            </div>
            <button type="button" class="btn-close-custom" data-bs-dismiss="offcanvas">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
        
        <div class="offcanvas-body p-4">
            <div class="mb-3 position-relative form-floating-custom">
                <input type="text" class="form-control custom-input" id="noteTitle" placeholder="Tựa đề*">
                <label for="noteTitle">Tựa đề*</label>
                <div class="char-count">0/60</div>
            </div>
            
            <div class="mb-3 position-relative form-floating-custom">
                <textarea class="form-control custom-textarea" id="noteDesc" placeholder="Mô tả" rows="3"></textarea>
                <label for="noteDesc">Mô tả</label>
                <div class="char-count">0/150</div>
            </div>
            
            <div class="mb-4 position-relative form-floating-custom">
                <input type="text" class="form-control custom-input pe-5" id="noteDate" placeholder="Nhập ngày hoặc phạm vi ngày*">
                <label for="noteDate">Nhập ngày hoặc phạm vi ngày*</label>
                <i class="bi bi-calendar3 calendar-icon"></i>
            </div>
            
            <div class="color-picker d-flex gap-3 mt-4">
                <div class="color-circle active" style="background-color: #673ab7;">
                    <i class="bi bi-check2"></i>
                </div>
                <div class="color-circle" style="background-color: #c62828;"></div>
                <div class="color-circle" style="background-color: #2e7d32;"></div>
                <div class="color-circle" style="background-color: #0288d1;"></div>
                <div class="color-circle" style="background-color: #1565c0;"></div>
                <div class="color-circle" style="background-color: #795548;"></div>
            </div>
        </div>
        
        <div class="offcanvas-footer border-top p-3 d-flex justify-content-end align-items-center bg-white">
            <button class="btn btn-light px-4 py-2 custom-btn-disabled" disabled>Tạo chú thích</button>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="offcanvas2.js"></script>
</body>
</html>
