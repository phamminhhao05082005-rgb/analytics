<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Attribution Style 2</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="breadcrumb3.css">
</head>
<body class="bg-light p-5 d-flex justify-content-center">

<div class="w-100" style="max-width: 1200px;">
    <div class="style2-container d-flex align-items-center w-100 overflow-x-auto pb-3 custom-scrollbar">
        <div class="s2-track d-flex">
            <div class="s2-item">
                <span class="s2-text">Những điểm tiếp xúc ở đầu</span>
                <span class="s2-badge">5.48%</span>
            </div>
            
            <div class="s2-divider"></div>
            
            <div class="s2-item">
                <span class="s2-text">Những điểm tiếp xúc ở giữa</span>
                <span class="s2-badge">3.25%</span>
            </div>
            
            <div class="s2-divider"></div>
            
            <div class="s2-item">
                <span class="s2-text">Những điểm tiếp xúc ở cuối</span>
                <span class="s2-badge">91.27%</span>
            </div>
            
            <div class="s2-divider"></div>
            
            <div class="s2-check-container">
                <div class="s2-check-inner">
                    <i class="bi bi-check"></i>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
