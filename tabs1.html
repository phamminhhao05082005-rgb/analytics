<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Exploration Tabs</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="tabs1.css">
</head>
<body class="bg-light p-4 d-flex justify-content-center">

<div class="exploration-wrapper shadow-sm">
    
    <div class="exploration-header d-flex justify-content-between">
        <div class="d-flex flex-grow-1 position-relative">
            <div class="tabs-list d-flex align-items-end" id="tabsList">
            </div>

            <div class="add-tab-container d-flex align-items-center px-2 border-end border-bottom bg-light h-100">
                <div class="dropdown">
                    <button class="btn btn-add-tab d-flex align-items-center justify-content-center" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-plus fs-5"></i>
                    </button>
                    <ul class="dropdown-menu shadow custom-dropdown-menu mt-2">
                        <li><a class="dropdown-item" href="#" data-type="Biểu mẫu tùy ý">Biểu mẫu tùy ý</a></li>
                        <li><a class="dropdown-item" href="#" data-type="Khám phá nhóm thuần tập">Khám phá nhóm thuần tập</a></li>
                        <li><a class="dropdown-item" href="#" data-type="Khám phá phễu">Khám phá phễu</a></li>
                        <li><a class="dropdown-item" href="#" data-type="Chồng chéo phân khúc">Chồng chéo phân khúc</a></li>
                        <li><a class="dropdown-item" href="#" data-type="Khám phá lộ trình">Khám phá lộ trình</a></li>
                        <li><a class="dropdown-item" href="#" data-type="Trình khám phá người dùng">Trình khám phá người dùng</a></li>
                        <li><a class="dropdown-item" href="#" data-type="Giá trị lâu dài của người dùng">Giá trị lâu dài của người dùng</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="header-actions d-flex align-items-center gap-3 px-4 border-bottom bg-light">
            <i class="bi bi-arrow-90deg-left action-icon disabled"></i>
            <i class="bi bi-arrow-90deg-right action-icon disabled"></i>
            <i class="bi bi-download action-icon"></i>
            <i class="bi bi-folder-plus action-icon"></i>
            <i class="bi bi-person-plus action-icon"></i>
            <div class="status-indicator dropdown">
                <button class="btn btn-sm p-0 border-0 d-flex align-items-center gap-1" data-bs-toggle="dropdown">
                    <i class="bi bi-check-circle text-success fs-5"></i>
                    <i class="bi bi-caret-down-fill text-secondary" style="font-size: 10px;"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="exploration-content bg-white position-relative" id="tabContent">
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="tabs1.js"></script>
</body>
</html>
