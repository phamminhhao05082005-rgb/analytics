<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks Banner Card</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="card2.css">
</head>
<body class="p-5 bg-white d-flex justify-content-center">

<div class="tasks-banner-container">
    <div class="tasks-content">
        <h2 class="tasks-title">Tasks</h2>
        <p class="tasks-description">
            Thiết lập những tính năng này để khai thác tối đa tài sản của bạn. Bản phân tích dữ liệu nâng cao và thông minh hơn đang chờ bạn. 
            <a href="#" class="tasks-link">Tìm hiểu thêm về nhiệm vụ</a>
        </p>
        
        <div class="tasks-progress-info">
            Còn 8 / 11 nhiệm vụ <i class="bi bi-question-circle"></i>
        </div>
        
        <div class="tasks-progress-track">
            <div class="tasks-progress-fill" style="width: 27%;"></div>
        </div>
    </div>
    
    <div class="tasks-illustration">
        <svg viewBox="0 0 420 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <line x1="20" y1="180" x2="400" y2="180" stroke="#3c4043" stroke-width="1"/>

            <circle cx="190" cy="46" r="1.5" fill="#3c4043"/>
            <circle cx="196" cy="46" r="1.5" fill="#3c4043"/>
            
            <rect x="195" y="65" width="70" height="40" fill="none" stroke="#3c4043" stroke-width="1"/>
            <circle cx="230" cy="85" r="12" fill="#4285f4"/>
            
            <rect x="275" y="65" width="30" height="40" fill="#f1f3f4"/>
            <line x1="290" y1="75" x2="290" y2="95" stroke="#fff" stroke-width="2"/>
            <line x1="280" y1="85" x2="300" y2="85" stroke="#fff" stroke-width="2"/>
            
            <line x1="195" y1="115" x2="230" y2="115" stroke="#3c4043" stroke-width="1.5"/>
            <line x1="240" y1="115" x2="275" y2="115" stroke="#3c4043" stroke-width="1.5"/>
            <line x1="285" y1="115" x2="305" y2="115" stroke="#3c4043" stroke-width="1.5"/>
            <line x1="195" y1="125" x2="230" y2="125" stroke="#3c4043" stroke-width="1.5"/>
            <line x1="240" y1="125" x2="275" y2="125" stroke="#3c4043" stroke-width="1.5"/>
            <line x1="285" y1="125" x2="305" y2="125" stroke="#3c4043" stroke-width="1.5"/>
            
            <rect x="330" y="70" width="16" height="50" fill="#34a853"/>
            <circle cx="360" cy="65" r="14" fill="#fbbc04"/>
            
            <path d="M346,80 Q356,70 366,80 L366,110 L346,110 Z" fill="#d2e3fc" stroke="#3c4043" stroke-width="1"/>
            <circle cx="356" cy="62" r="6" fill="#8d6e63"/>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</html>
