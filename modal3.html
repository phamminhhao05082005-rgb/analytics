<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Filter Modal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="modal3.css">
</head>
<body class="bg-light p-5 d-flex justify-content-center">

<button class="btn btn-add-filter" type="button" data-bs-toggle="modal" data-bs-target="#filterModal">
    Thêm bộ lọc <i class="bi bi-plus fs-5"></i>
</button>

<div class="modal fade" id="filterModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered custom-modal-dialog">
        <div class="modal-content custom-modal-content shadow">
            
            <div class="modal-header border-bottom py-2 px-3">
                <div class="d-flex align-items-center gap-3 w-100">
                    <button type="button" class="btn btn-close-custom shadow-none" data-bs-dismiss="modal">
                        <i class="bi bi-arrow-left"></i>
                    </button>
                    <span class="modal-title-text flex-grow-1">Tạo bộ lọc</span>
                    <button type="button" class="btn btn-close-custom shadow-none" data-bs-dismiss="modal">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
            </div>
            
            <div class="modal-body p-0 d-flex flex-column custom-scrollbar">
                <div class="flex-grow-1 p-3">
                    <div class="section-label mb-2">ĐIỀU KIỆN (TẠO TỐI ĐA 5)</div>
                    
                    <div class="filter-condition-card">
                        
                        <div class="form-group mb-3 position-relative">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label mb-0">Phương diện</label>
                                <i class="bi bi-trash cursor-pointer text-secondary" id="clearBtn"></i>
                            </div>
                            
                            <div class="custom-select-wrapper" id="dimSelectWrapper">
                                <div class="custom-select-trigger" id="dimTrigger">
                                    <span class="select-text">Chọn phương diện</span>
                                    <i class="bi bi-caret-down-fill select-caret"></i>
                                </div>
                                <div class="custom-options-menu custom-scrollbar shadow">
                                    <div class="menu-header px-3 py-2 border-bottom">
                                        <button class="btn btn-outline-secondary btn-sm rounded-pill w-100 d-flex justify-content-start align-items-center gap-2">
                                            <i class="bi bi-funnel"></i> Bộ lọc Trên nhiều kênh
                                        </button>
                                    </div>
                                    
                                    <div class="menu-group-title">Chung</div>
                                    <div class="custom-option nested-option" data-value="Tên bộ lọc dữ liệu thử nghiệm">Tên bộ lọc dữ liệu thử nghiệm</div>
                                    <div class="custom-option nested-option" data-value="Giá trị lâu dài của người dùng">Giá trị lâu dài của người dùng</div>
                                    <div class="custom-option nested-option" data-value="Ngày truy cập lần đầu">Ngày truy cập lần đầu</div>
                                    
                                    <div class="menu-group-title mt-2">Giờ</div>
                                    <div class="custom-option nested-option" data-value="Ngày đầu tiên của phiên">Ngày đầu tiên của phiên</div>
                                    <div class="custom-option nested-option" data-value="Giờ">Giờ</div>
                                    <div class="custom-option nested-option" data-value="Ngày">Ngày</div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group mb-3 position-relative">
                            <label class="form-label d-flex align-items-center gap-1 mb-1">
                                Loại Đối sánh <i class="bi bi-question-circle text-secondary" style="font-size: 13px;"></i>
                            </label>
                            
                            <div class="custom-select-wrapper" id="matchSelectWrapper">
                                <div class="custom-select-trigger" id="matchTrigger">
                                    <span class="select-text">Chọn kiểu khớp</span>
                                    <i class="bi bi-caret-down-fill select-caret"></i>
                                </div>
                                <div class="custom-options-menu custom-scrollbar shadow">
                                    <div class="custom-option" data-value="khớp chính xác">khớp chính xác</div>
                                    <div class="custom-option" data-value="chứa">chứa</div>
                                    <div class="custom-option" data-value="bắt đầu bằng">bắt đầu bằng</div>
                                    <div class="custom-option" data-value="kết thúc bằng">kết thúc bằng</div>
                                    <div class="custom-option" data-value="khớp với biểu thức chính quy">khớp với biểu thức chính quy</div>
                                    <div class="custom-option" data-value="khớp với một phần biểu thức">khớp với một phần biểu thức</div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group mb-0">
                            <label class="form-label mb-1">Giá trị</label>
                            <input type="text" class="form-control custom-input" id="valueInput" placeholder="Nhập giá trị phương diện">
                        </div>
                        
                        <div class="add-condition-footer border-top mt-3 pt-3 text-center">
                            <button class="btn btn-link text-decoration-none add-condition-btn d-inline-flex align-items-center gap-1">
                                <i class="bi bi-plus-lg"></i> Thêm điều kiện mới
                            </button>
                        </div>
                        
                    </div>
                </div>
            </div>
            
            <div class="modal-footer border-top p-3 d-flex justify-content-end bg-white">
                <button class="btn btn-apply" id="applyBtn" disabled>Áp dụng</button>
            </div>
            
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="modal3.js"></script>
</body>
</html>
