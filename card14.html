<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Settings Card</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="card14.css">
</head>
<body class="bg-light p-5 d-flex justify-content-center">

<div class="data-settings-card shadow-sm bg-white">
    
    <div class="card-header-section">
        <h2 class="card-main-title">Thu thập và sửa đổi dữ liệu</h2>
        <p class="card-sub-desc">Các chế độ cài đặt này kiểm soát cách thu thập và sửa đổi dữ liệu</p>
    </div>

    <div class="settings-list d-flex flex-column pb-3">
        
        <a href="#" class="setting-item d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div class="icon-wrapper">
                    <i class="bi bi-sliders"></i>
                </div>
                <span class="setting-text">Luồng dữ liệu</span>
            </div>
            <div class="help-icon-wrapper" data-bs-toggle="tooltip" data-bs-placement="top" title="Trợ giúp về Luồng dữ liệu">
                <i class="bi bi-question-circle"></i>
            </div>
        </a>

        <a href="#" class="setting-item d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div class="icon-wrapper">
                    <i class="bi bi-database"></i>
                </div>
                <span class="setting-text">Thu thập dữ liệu</span>
            </div>
            <div class="help-icon-wrapper" data-bs-toggle="tooltip" data-bs-placement="top" title="Trợ giúp về Thu thập dữ liệu">
                <i class="bi bi-question-circle"></i>
            </div>
        </a>

        <a href="#" class="setting-item d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div class="icon-wrapper">
                    <i class="bi bi-upload"></i>
                </div>
                <span class="setting-text">Nhập dữ liệu</span>
            </div>
            <div class="help-icon-wrapper" data-bs-toggle="tooltip" data-bs-placement="top" title="Trợ giúp về Nhập dữ liệu">
                <i class="bi bi-question-circle"></i>
            </div>
        </a>

        <a href="#" class="setting-item d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div class="icon-wrapper" style="transform: rotate(-45deg);">
                    <i class="bi bi-magnet"></i>
                </div>
                <span class="setting-text">Giữ lại dữ liệu</span>
            </div>
            <div class="help-icon-wrapper" data-bs-toggle="tooltip" data-bs-placement="top" title="Trợ giúp về Giữ lại dữ liệu">
                <i class="bi bi-question-circle"></i>
            </div>
        </a>

        <a href="#" class="setting-item d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div class="icon-wrapper">
                    <i class="bi bi-funnel"></i>
                </div>
                <span class="setting-text">Bộ lọc dữ liệu</span>
            </div>
            <div class="help-icon-wrapper" data-bs-toggle="tooltip" data-bs-placement="top" title="Trợ giúp về Bộ lọc dữ liệu">
                <i class="bi bi-question-circle"></i>
            </div>
        </a>

        <a href="#" class="setting-item d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div class="icon-wrapper">
                    <i class="bi bi-person-check"></i>
                </div>
                <span class="setting-text">Chế độ cài đặt về sự đồng ý</span>
            </div>
            <div class="help-icon-wrapper" data-bs-toggle="tooltip" data-bs-placement="top" title="Trợ giúp về Chế độ cài đặt về sự đồng ý">
                <i class="bi bi-question-circle"></i>
            </div>
        </a>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="card14.js"></script>
</body>
</html>
