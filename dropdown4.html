<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Conversion Settings Dropdown</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="dropdown4.css">
</head>
<body class="bg-light p-5">

<div class="dropdown custom-dropdown-container">
    <button class="btn btn-settings-trigger d-flex align-items-center gap-2 shadow-none" type="button" id="settingsDropdownBtn" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
        <span id="triggerChannel">Có tính phí và không tính phí</span>
        <span class="trigger-divider">|</span>
        <span id="triggerModel">Dựa trên dữ liệu</span>
        <i class="bi bi-caret-down-fill ms-1" style="font-size: 10px;"></i>
    </button>
    
    <div class="dropdown-menu settings-dropdown-menu shadow" aria-labelledby="settingsDropdownBtn">
        
        <div class="px-4 py-3">
            <h5 class="settings-main-title mb-1">Cài đặt chuyển đổi</h5>
            <p class="settings-desc mb-0">Bạn có thể quản lý chế độ cài đặt của từng lượt chuyển đổi trong tài khoản Google Ads này hoặc trong Google Analytics.</p>
        </div>
        
        <div class="dropdown-divider m-0"></div>
        
        <div class="px-4 py-3">
            <div class="d-flex align-items-center gap-1 mb-2">
                <span class="section-label">Kênh đủ điều kiện nhận giá trị đóng góp cho lượt chuyển đổi</span>
                <i class="bi bi-question-circle text-secondary question-icon"></i>
            </div>
            <div class="static-value-text fw-medium">Có tính phí và không tính phí</div>
        </div>
        
        <div class="dropdown-divider m-0"></div>
        
        <div class="px-4 py-3">
            <div class="d-flex align-items-center gap-1 mb-3">
                <span class="section-label">Mô hình phân bổ</span>
                <i class="bi bi-question-circle text-secondary question-icon"></i>
            </div>
            
            <div class="d-flex gap-4">
                <label class="radio-container d-flex align-items-center gap-2">
                    <input type="radio" name="attrModel" value="Dựa trên dữ liệu" class="custom-ga-radio" checked>
                    <i class="bi bi-bar-chart-fill text-secondary opacity-75 fs-6"></i>
                    <span class="radio-label-text">Dựa trên dữ liệu</span>
                </label>
                
                <label class="radio-container d-flex align-items-center gap-2">
                    <input type="radio" name="attrModel" value="Lượt nhấp cuối cùng" class="custom-ga-radio">
                    <i class="bi bi-bar-chart text-secondary opacity-75 fs-6"></i>
                    <span class="radio-label-text">Lượt nhấp cuối cùng</span>
                </label>
            </div>
        </div>
        
        <div class="dropdown-divider m-0"></div>
        
        <div class="px-4 py-3">
            <div class="d-flex align-items-center gap-1 mb-3">
                <span class="section-label">Thời điểm phân bổ</span>
                <i class="bi bi-question-circle text-secondary question-icon"></i>
            </div>
            
            <div class="d-flex gap-4">
                <label class="radio-container d-flex align-items-center gap-2 position-relative">
                    <div class="highlight-bg"></div>
                    <input type="radio" name="attrTime" value="theo thời gian chuyển đổi" class="custom-ga-radio">
                    <span class="radio-label-text">theo thời gian chuyển đổi</span>
                </label>
                
                <label class="radio-container d-flex align-items-center gap-2 position-relative">
                    <div class="highlight-bg"></div>
                    <input type="radio" name="attrTime" value="theo thời gian tương tác" class="custom-ga-radio" checked>
                    <span class="radio-label-text">theo thời gian tương tác</span>
                </label>
            </div>
        </div>
        
        <div class="px-4 py-3 d-flex justify-content-end gap-3 mt-1">
            <button class="btn btn-action-text btn-cancel px-2 py-1 shadow-none" id="cancelSettingsBtn">Hủy</button>
            <button class="btn btn-action-text btn-apply px-2 py-1 shadow-none" id="applySettingsBtn" disabled>Ứng tuyển</button>
        </div>
        
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="dropdown4.js"></script>
</body>
</html>
