<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics User Activity Card</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="card13.css">
</head>
<body class="bg-light p-5 d-flex justify-content-center">

<div class="analytic-activity-card shadow-sm bg-white">
    
    <div class="card-header bg-white border-0 px-4 pt-4 pb-2 d-flex justify-content-between align-items-start">
        <div class="metric-title dashed-border">Hoạt động của người dùng qua thời gian</div>
        
        <div class="badge-icon-wrapper dropdown">
            <button class="btn btn-outline-secondary btn-sm badge-dropdown-btn d-flex align-items-center gap-2 shadow-none" type="button" data-bs-toggle="dropdown">
                <i class="bi bi-check-circle text-success"></i>
                <i class="bi bi-caret-down-fill text-secondary" style="font-size: 10px;"></i>
            </button>
            <ul class="dropdown-menu shadow-sm dropdown-menu-end">
                <li><a class="dropdown-item" href="#">Tùy chọn 1</a></li>
                <li><a class="dropdown-item" href="#">Tùy chọn 2</a></li>
            </ul>
        </div>
    </div>

    <div class="card-body px-4 py-2 d-flex gap-3">
        
        <div class="chart-container flex-grow-1 position-relative">
            <svg class="w-100" height="260" viewBox="0 0 460 260" preserveAspectRatio="none">
                
                <line x1="20" y1="230" x2="400" y2="230" class="grid-line" />
                <line x1="20" y1="195" x2="400" y2="195" class="grid-line" />
                <line x1="20" y1="160" x2="400" y2="160" class="grid-line" />
                <line x1="20" y1="125" x2="400" y2="125" class="grid-line" />
                <line x1="20" y1="90" x2="400" y2="90" class="grid-line" />
                <line x1="20" y1="55" x2="400" y2="55" class="grid-line" />
                
                <text x="410" y="234" class="y-label">0</text>
                <text x="410" y="199" class="y-label">20 N</text>
                <text x="410" y="164" class="y-label">40 N</text>
                <text x="410" y="129" class="y-label">60 N</text>
                <text x="410" y="94" class="y-label">80 N</text>
                <text x="410" y="59" class="y-label">100 N</text>
                <text x="410" y="24" class="y-label">120 N</text>

                <text x="30" y="245" class="x-label" text-anchor="middle">21<tspan x="30" dy="14">thg</tspan></text>
                <text x="90" y="245" class="x-label" text-anchor="middle">22</text>
                <text x="150" y="245" class="x-label" text-anchor="middle">23</text>
                <text x="210" y="245" class="x-label" text-anchor="middle">24</text>
                <text x="270" y="245" class="x-label" text-anchor="middle">25</text>
                <text x="330" y="245" class="x-label" text-anchor="middle">26</text>
                <text x="390" y="245" class="x-label" text-anchor="middle">27</text>

                <polyline points="20,55 90,55 150,54 210,53 270,52 330,54 390,60" class="line-blue" />
                <polyline points="20,175 90,175 150,176 210,176 270,174 330,175 390,188" class="line-green" />
                <polyline points="20,215 90,215 150,216 210,217 270,215 330,218 390,227" class="line-pink" />

                <circle cx="390" cy="60" r="4" fill="#4285f4" />
                <rect x="386" y="184" width="8" height="8" fill="#8bc34a" />
                <polygon points="390,223 394,227 390,231 386,227" fill="#e91e63" />

                <g id="interactiveLayer"></g>
            </svg>
        </div>

        <div class="stats-container flex-shrink-0 d-flex flex-column gap-3 pt-2">
            
            <div class="stat-block">
                <div class="d-flex align-items-center gap-2 stat-label">
                    <div class="marker-dot blue"></div>
                    30 NG...
                </div>
                <div class="stat-val">97 N</div>
                <div class="stat-trend text-success">
                    <i class="bi bi-arrow-up"></i> 0,4%
                </div>
            </div>

            <div class="stat-block">
                <div class="d-flex align-items-center gap-2 stat-label">
                    <div class="marker-square green"></div>
                    7 NGÀY
                </div>
                <div class="stat-val">24 N</div>
                <div class="stat-trend text-danger">
                    <i class="bi bi-arrow-down"></i> 6,9%
                </div>
            </div>

            <div class="stat-block">
                <div class="d-flex align-items-center gap-2 stat-label">
                    <div class="marker-diamond pink"></div>
                    1 NGÀY
                </div>
                <div class="stat-val">1,6 N</div>
                <div class="stat-trend text-danger">
                    <i class="bi bi-arrow-down"></i> 56,8%
                </div>
            </div>

        </div>
    </div>

    <div class="card-footer bg-white border-0 px-4 pb-4 pt-2">
        <div class="dropdown">
            <button class="btn btn-sm dropdown-toggle custom-dropdown-btn shadow-none text-secondary p-0" type="button" data-bs-toggle="dropdown">
                7 ngày trước
            </button>
            <ul class="dropdown-menu shadow-sm">
                <li><a class="dropdown-item" href="#">Hôm nay</a></li>
                <li><a class="dropdown-item active" href="#">7 ngày trước</a></li>
                <li><a class="dropdown-item" href="#">28 ngày trước</a></li>
            </ul>
        </div>
    </div>

</div>

<div class="chart-popover shadow" id="chartPopover">
    <div class="popover-date pb-2 mb-2 border-bottom" id="popDate">21 thg 9, 2026</div>
    
    <div class="d-flex justify-content-between align-items-center gap-4 mb-2">
        <div class="d-flex align-items-center gap-2">
            <div class="marker-dot blue"></div>
            <span class="popover-label">30 ngày</span>
        </div>
        <span class="popover-val fw-bold" id="pop30">100.521</span>
    </div>

    <div class="d-flex justify-content-between align-items-center gap-4 mb-2">
        <div class="d-flex align-items-center gap-2">
            <div class="marker-square green"></div>
            <span class="popover-label">7 ngày</span>
        </div>
        <span class="popover-val fw-bold" id="pop7">28.412</span>
    </div>

    <div class="d-flex justify-content-between align-items-center gap-4">
        <div class="d-flex align-items-center gap-2">
            <div class="marker-diamond pink"></div>
            <span class="popover-label">1 ngày</span>
        </div>
        <span class="popover-val fw-bold" id="pop1">3.204</span>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="card13.js"></script>
</body>
</html>
