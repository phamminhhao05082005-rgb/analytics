<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Dropdown</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="dropdown2.css">
</head>
<body class="p-5 bg-light d-flex justify-content-center">

<div class="dropdown">
    <button class="avatar-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <div class="avatar purple-avatar">P</div>
    </button>
    
    <div class="dropdown-menu shadow-sm profile-menu-panel">
        <div class="profile-header">
            <div class="avatar-large purple-avatar">P</div>
            <div class="profile-info">
                <div class="profile-name">Phạm Minh Hào</div>
                <div class="profile-email">phamminhhao0508200...</div>
                <a href="#" class="privacy-link">Chính sách quyền riêng tư</a>
            </div>
        </div>
        
        <div class="menu-divider"></div>
        
        <a href="#" class="profile-item alt-account">
            <div class="avatar-medium blue-avatar"><i class="bi bi-person-fill"></i></div>
            <div class="alt-info">
                <div class="alt-name">HÀO PHẠM MINH</div>
                <div class="alt-email">2351010052hao@ou.edu.vn</div>
            </div>
        </a>
        
        <div class="menu-divider"></div>
        
        <a href="#" class="profile-item action-item">
            <i class="bi bi-plus-lg fs-5"></i> Thêm tài khoản
        </a>
        <a href="#" class="profile-item action-item">
            <i class="bi bi-list-ul fs-5"></i> Manage account
        </a>
        
        <div class="menu-divider"></div>
        
        <a href="#" class="profile-item action-item">
            <i class="bi bi-box-arrow-right fs-5"></i> Đăng xuất
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
