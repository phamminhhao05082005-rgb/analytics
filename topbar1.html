<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Topbar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="topbar1.css">
</head>
<body>

<header class="topbar-container">
    <div class="topbar-left">
        <a href="#" class="brand-link">
            <div class="analytics-logo">
                <div class="bar bar1"></div>
                <div class="bar bar2"></div>
                <div class="bar bar3"></div>
            </div>
            <span class="brand-name">Analytics</span>
        </a>
        
        <div class="divider"></div>
        
        <div class="account-selector cursor-pointer">
            <div class="account-breadcrumb">
                Tất cả tài khoản <i class="bi bi-chevron-right"></i> Minh Hào
            </div>
            <div class="account-current">
                Minh Hào <i class="bi bi-caret-down-fill ms-1" style="font-size: 10px;"></i>
            </div>
        </div>
    </div>

    <div class="topbar-center">
        <div class="search-box">
            <i class="bi bi-search search-icon"></i>
            <input type="text" class="search-input" placeholder="Thử tìm kiếm &quot;cách thiết lập Analytics&quot;">
        </div>
    </div>

    <div class="topbar-right">
        <button class="icon-btn" type="button">
            <i class="bi bi-grid-3x3-gap-fill"></i>
        </button>

        <button class="icon-btn" type="button">
            <i class="bi bi-question-circle-fill"></i>
        </button>

        <button class="avatar-btn" type="button">
            <div class="avatar purple-avatar">P</div>
        </button>
    </div>
</header>

</body>
</html>
