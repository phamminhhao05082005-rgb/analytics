<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Geo Chart Card</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="card17.css">
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
</head>
<body class="bg-light p-5 d-flex justify-content-center">

<div class="geo-card bg-white shadow-sm">
    
    <div class="card-header-top d-flex justify-content-between align-items-center px-4 pt-4 pb-3">
        <div class="card-title-group d-flex align-items-center gap-1">
            <span class="card-title-text cursor-pointer">Số người dùng đang hoạt động</span>
            <i class="bi bi-caret-down-fill text-secondary me-1" style="font-size: 10px;"></i>
            <span class="card-title-text text-secondary">theo</span>
            <span class="card-title-text dashed-text">Quốc gia</span>
        </div>
        <div class="dropdown">
            <button class="btn btn-outline-secondary btn-sm badge-dropdown-btn d-flex align-items-center gap-2 shadow-none" type="button" data-bs-toggle="dropdown">
                <i class="bi bi-check-circle text-success"></i>
                <i class="bi bi-caret-down-fill text-secondary" style="font-size: 10px;"></i>
            </button>
        </div>
    </div>

    <div class="row g-0 px-4 pb-2">
        <div class="col-7 position-relative">
            <div class="map-wrapper" id="mapWrapper">
                <div id="regions_div" class="w-100 h-100"></div>
            </div>
            
            <div class="map-controls shadow-sm">
                <button class="map-btn border-bottom" id="zoomInBtn"><i class="bi bi-plus"></i></button>
                <button class="map-btn" id="zoomOutBtn"><i class="bi bi-dash"></i></button>
            </div>
            
            <div class="map-copyright d-flex gap-2">
                <span>Dữ liệu bản đồ ©2026</span>
                <span class="cursor-pointer hover-underline">Điều khoản</span>
            </div>
        </div>
        
        <div class="col-5 ps-4">
            <table class="geo-table w-100">
                <thead>
                    <tr>
                        <th class="text-start pb-2"><span class="dashed-header">QUỐC GIA</span></th>
                        <th class="text-end pb-2"><span class="dashed-header">SỐ NGƯỜI DÙ...</span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="2" class="p-0">
                            <div class="d-flex justify-content-between row-text">
                                <span>India</span>
                                <span>4,7 N</span>
                            </div>
                            <div class="bar-track"><div class="bar-fill" style="width: 100%;"></div></div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" class="p-0">
                            <div class="d-flex justify-content-between row-text">
                                <span>Bangladesh</span>
                                <span>3,2 N</span>
                            </div>
                            <div class="bar-track"><div class="bar-fill" style="width: 68%;"></div></div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" class="p-0">
                            <div class="d-flex justify-content-between row-text">
                                <span>United States</span>
                                <span>2,9 N</span>
                            </div>
                            <div class="bar-track"><div class="bar-fill" style="width: 61%;"></div></div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" class="p-0">
                            <div class="d-flex justify-content-between row-text">
                                <span>Nigeria</span>
                                <span>1,1 N</span>
                            </div>
                            <div class="bar-track"><div class="bar-fill" style="width: 23%;"></div></div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" class="p-0">
                            <div class="d-flex justify-content-between row-text">
                                <span>Pakistan</span>
                                <span>894</span>
                            </div>
                            <div class="bar-track"><div class="bar-fill" style="width: 19%;"></div></div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" class="p-0">
                            <div class="d-flex justify-content-between row-text">
                                <span>Indonesia</span>
                                <span>845</span>
                            </div>
                            <div class="bar-track"><div class="bar-fill" style="width: 18%;"></div></div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" class="p-0">
                            <div class="d-flex justify-content-between row-text">
                                <span>Brazil</span>
                                <span>542</span>
                            </div>
                            <div class="bar-track"><div class="bar-fill" style="width: 11%;"></div></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card-footer bg-white border-0 px-4 pt-3 pb-4 text-end">
        <a href="#" class="view-link d-inline-flex align-items-center gap-2">
            Xem báo cáo quốc gia <i class="bi bi-arrow-right"></i>
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="card17.js"></script>
</body>
</html>
