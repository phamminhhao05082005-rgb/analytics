<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Help Popover</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="popover2.css">
</head>
<body class="bg-light p-5 d-flex justify-content-center">

<div class="dropdown">
    <button class="toolbar-icon-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false" data-bs-offset="0,10">
        <i class="bi bi-question-circle-fill"></i>
    </button>
    <ul class="dropdown-menu shadow custom-help-menu dropdown-menu-end">
        <li>
            <a class="dropdown-item d-flex align-items-center gap-3" href="#">
                <i class="bi bi-lightbulb fs-5"></i> Tìm hiểu về trang này
            </a>
        </li>
        <li>
            <a class="dropdown-item d-flex align-items-center gap-3" href="#">
                <i class="bi bi-cursor fs-5"></i> Bắt đầu tìm hiểu
            </a>
        </li>
        <li>
            <a class="dropdown-item d-flex align-items-center gap-3" href="#">
                <i class="bi bi-question-circle fs-5"></i> Yêu cầu trợ giúp thêm
            </a>
        </li>
        <li>
            <a class="dropdown-item d-flex align-items-center gap-3" href="#">
                <i class="bi bi-chat-square-text fs-5"></i> Gửi phản hồi
            </a>
        </li>
    </ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
