<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Bubble Card</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="card9.css">
</head>
<body class="bg-light p-5 d-flex justify-content-center">

<div class="bubble-card shadow-sm">
    
    <div class="card-header d-flex justify-content-between align-items-start">
        <h3 class="card-title">
            <span class="dashed-header">Số người dùng mới theo Nền</span>
        </h3>
        
        <div class="dropdown">
            <button class="btn btn-outline-secondary btn-sm badge-dropdown-btn d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" aria-expanded="false" data-bs-offset="0,5">
                <i class="bi bi-check-circle text-success"></i>
                <i class="bi bi-caret-down-fill text-secondary" style="font-size: 10px;"></i>
            </button>
            <div class="dropdown-menu shadow-sm info-dropdown p-0">
                <div class="info-item d-flex gap-3 p-3 border-bottom">
                    <i class="bi bi-check-square text-success fs-5"></i>
                    <div>
                        <div class="info-title">Chưa lấy mẫu thẻ</div>
                        <div class="info-desc">thẻ này là dựa trên 100,0% dữ liệu có sẵn.</div>
                    </div>
                </div>
                <div class="info-item d-flex gap-3 p-3">
                    <i class="bi bi-calendar4 text-secondary fs-5"></i>
                    <div>
                        <div class="info-title">Nguồn dữ liệu</div>
                        <div class="info-desc">Báo cáo đang hiển thị dữ liệu trong ngày. <a href="#">Tìm hiểu thêm về độ mới của dữ liệu</a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card-body px-4 py-3 d-flex align-items-start position-relative" style="min-height: 280px;">
        
        <div class="bubble-container h-100 d-flex align-items-center">
            <div class="main-bubble d-flex justify-content-center align-items-center shadow-sm">
                <span class="bubble-text">Web</span>
            </div>
        </div>

        <div class="stats-container position-absolute" style="right: 32px; top: 40px;">
            <div class="stats-label text-secondary mb-1">WEB</div>
            <div class="stats-value text-dark">100,0%</div>
        </div>

    </div>

    <div class="card-footer d-flex justify-content-end bg-white border-top-0 p-3 pt-2">
        <a href="#" class="view-report-link d-flex align-items-center gap-2">
            Xem các nền tảng <i class="bi bi-arrow-right"></i>
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
