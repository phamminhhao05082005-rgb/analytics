<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Attribution Breadcrumb</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="breadcrumb1.css">
</head>
<body class="bg-light p-5 d-flex justify-content-center">

<div class="attribution-container p-4 w-100 d-flex overflow-x-auto custom-scrollbar">
    
    <div class="chevron-step text-step">
        <div class="chevron-content dashed-group">
            <span class="step-text">Những điểm tiếp xúc ở đầu</span>
            <span class="pct-badge">5.48%</span>
        </div>
    </div>
    
    <div class="chevron-step text-step">
        <div class="chevron-content dashed-group">
            <span class="step-text">Những điểm tiếp xúc ở giữa</span>
            <span class="pct-badge">3.25%</span>
        </div>
    </div>
    
    <div class="chevron-step text-step">
        <div class="chevron-content dashed-group">
            <span class="step-text">Những điểm tiếp xúc ở cuối</span>
            <span class="pct-badge">91.27%</span>
        </div>
    </div>

    <div class="chevron-step check-step">
        <div class="chevron-content">
            <div class="check-circle"><i class="bi bi-check"></i></div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
